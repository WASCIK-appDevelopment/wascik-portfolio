<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>WASCIK review form definition</title></head>
<body>
  <!-- Static form definition used by Netlify Forms during deployment.
       The customer-facing form is rendered by app/ReviewPanel.tsx. -->
  <form name="wascik-customer-review" method="POST" data-netlify="true" data-netlify-honeypot="company-website" hidden>
    <input type="hidden" name="form-name" value="wascik-customer-review">
    <input name="company-website">
    <input name="rating">
    <input name="customer-name">
    <input name="email">
    <input name="service">
    <textarea name="review"></textarea>
    <input name="permission-to-publish">
  </form>
</body>
</html>
